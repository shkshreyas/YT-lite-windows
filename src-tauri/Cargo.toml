[package]
name = "yt-lite"
version = "1.0.0"
description = "Lightweight YouTube desktop app with ad blocking"
authors = ["shkshreyas"]
edition = "2021"

[lib]
name = "yt_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
