<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>YT Lite Chrome</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1f1f1f;
      --surface2: #2a2a2a;
      --border: #3a3a3a;
      --accent: #ff0000;
      --text: #e8e8e8;
      --muted: #888;
      --tab-active: #282828;
    }

    html, body {
      height: 100%; width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 12px;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    #bar {
      display: flex;
      align-items: center;
      height: 42px;
      padding: 0 6px 0 0;
      gap: 0;
      border-bottom: 1px solid var(--border);
    }

    /* Logo */
    #logo {
      display: flex; align-items: center; justify-content: center;
      width: 42px; height: 42px; flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    #logo svg { width: 22px; height: 22px; }

    /* Tabs */
    #tabs {
      display: flex;
      align-items: flex-end;
      flex: 1;
      gap: 1px;
      overflow-x: auto;
      overflow-y: hidden;
      height: 42px;
      scrollbar-width: none;
      -webkit-app-region: no-drag;
    }
    #tabs::-webkit-scrollbar { display: none; }

    .tab {
      display: flex; align-items: center; gap: 5px;
      height: 34px;
      padding: 0 8px 0 10px;
      border-radius: 8px 8px 0 0;
      background: var(--surface2);
      cursor: pointer;
      min-width: 100px; max-width: 200px;
      flex-shrink: 0;
      transition: background 0.12s;
      -webkit-app-region: no-drag;
    }
    .tab:hover { background: var(--surface); }
    .tab.active {
      background: var(--tab-active);
      box-shadow: inset 0 2px 0 var(--accent);
    }
    .tab img.fav {
      width: 14px; height: 14px; border-radius: 2px;
      flex-shrink: 0; object-fit: contain;
    }
    .tab .fav-placeholder {
      width: 14px; height: 14px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .tab .fav-placeholder svg { width: 12px; height: 12px; }
    .tab .title {
      flex: 1; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
      font-size: 12px; color: var(--text);
    }
    .tab .close {
      width: 18px; height: 18px; border-radius: 50%;
      border: none; background: transparent;
      color: var(--muted); font-size: 12px;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s, color 0.1s;
    }
    .tab .close:hover { background: #555; color: var(--text); }

    /* New tab button */
    #new-tab {
      width: 30px; height: 28px; border-radius: 6px;
      border: none; background: transparent;
      color: var(--muted); font-size: 20px; font-weight: 300;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      margin: 0 2px;
      transition: background 0.1s, color 0.1s;
      -webkit-app-region: no-drag;
    }
    #new-tab:hover { background: var(--surface2); color: var(--text); }

    /* Window controls */
    #win-controls {
      display: flex; gap: 1px; margin-left: 4px;
      -webkit-app-region: no-drag;
    }
    #win-controls button {
      width: 30px; height: 28px; border-radius: 6px;
      border: none; background: transparent;
      color: var(--muted); font-size: 13px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s, color 0.1s;
    }
    #win-controls button:hover { background: var(--surface2); color: var(--text); }
    #btn-close:hover { background: #c42b1c !important; color: #fff !important; }
  </style>
</head>
<body>
<div id="bar">
  <!-- YouTube logo -->
  <div id="logo">
    <svg viewBox="0 0 90 20" xmlns="http://www.w3.org/2000/svg">
      <path d="M27.97 3.63s-.3-2.1-1.2-3.02C25.63.48 24.4.47 23.83.4 19.9.12 14 .12 14 .12s-5.9 0-9.83.28C3.6.47 2.37.48 1.23.61.33 1.53.03 3.63.03 3.63S-.27 6.08-.27 8.52v2.3c0 2.44.3 4.88.3 4.88s.3 2.1 1.2 3.02c1.14 1.13 2.63 1.1 3.3 1.21C6.6 20 14 20 14 20s5.91-.01 9.84-.29c.57-.07 1.8-.08 2.94-1.2.9-.93 1.2-3.03 1.2-3.03s.3-2.44.3-4.88v-2.3c0-2.44-.31-4.88-.31-4.88zM11.1 13.37V5.97l7.93 3.7-7.93 3.7z" fill="#FF0000"/>
      <path d="M36.46 14.07L32.63 1.04h2.62l1.54 6.53c.39 1.52.68 2.81.88 3.88h.07c.13-.76.43-2.05.88-3.88l1.57-6.53h2.62L38.95 14.07v6.04h-2.5v-6.04zM44.2 8.27c0-1.4.38-2.5 1.13-3.3.76-.8 1.8-1.2 3.13-1.2 1.4 0 2.45.4 3.17 1.2.72.8 1.08 1.9 1.08 3.3v4.07c0 1.42-.36 2.53-1.07 3.33-.71.8-1.77 1.2-3.17 1.2-1.42 0-2.48-.4-3.2-1.2-.7-.8-1.07-1.91-1.07-3.33V8.27zm2.45 4.22c0 .76.17 1.34.5 1.74.33.4.8.6 1.39.6.6 0 1.06-.2 1.39-.6.33-.4.5-.98.5-1.74V8.13c0-.76-.17-1.34-.5-1.74-.33-.4-.79-.6-1.38-.6-.6 0-1.07.2-1.4.6-.33.4-.5.98-.5 1.74v4.36zM57.35 20.11h-2.22V4.08h2.22v1.23c.77-.96 1.7-1.44 2.8-1.44.95 0 1.67.36 2.16 1.08.5.72.74 1.81.74 3.27v4.5c0 1.46-.25 2.55-.74 3.27-.49.72-1.21 1.08-2.17 1.08-1.04 0-1.95-.46-2.79-1.4v4.44zm4.25-11.8c0-.85-.13-1.48-.38-1.89-.26-.4-.66-.6-1.2-.6-.7 0-1.33.32-1.88.96v6.36c.55.63 1.18.95 1.88.95.55 0 .95-.2 1.2-.6.25-.4.38-1.04.38-1.9V8.31zM66.22 3.98h2.45v9.62c0 .59.12 1.02.35 1.28.24.27.6.4 1.1.4.62 0 1.27-.2 1.96-.59v-10.7h2.45v12.02h-2.45v-1.02c-.88.82-1.84 1.23-2.89 1.23-.93 0-1.62-.29-2.06-.86-.44-.57-.67-1.43-.67-2.57l-.24-9.81zM80.5 14.03c.6 0 1.34-.2 2.22-.6v2.07c-.9.44-1.88.66-2.96.66-1.31 0-2.26-.43-2.86-1.3-.6-.86-.9-2.12-.9-3.78V8.13c0-1.52.3-2.7.9-3.53.6-.82 1.48-1.23 2.66-1.23 1.18 0 2.06.4 2.65 1.18.58.79.88 1.95.88 3.5v2.4h-4.64v1.93c0 .9.14 1.56.43 1.99.29.43.73.64 1.62.64zm.9-6.04c0-.83-.12-1.45-.36-1.85-.24-.4-.6-.61-1.1-.61-.5 0-.87.21-1.12.62-.25.4-.37 1.03-.37 1.85v.9h2.95v-.9z" fill="#fff"/>
    </svg>
  </div>

  <div id="tabs"></div>
  <button id="new-tab" title="New tab (Ctrl+T)">+</button>

  <div id="win-controls">
    <button id="btn-min" title="Minimize">─</button>
    <button id="btn-max" title="Maximize/Restore">□</button>
    <button id="btn-close" title="Close">✕</button>
  </div>
</div>

<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
const { getCurrentWindow } = window.__TAURI__.window;

const tabsEl = document.getElementById('tabs');
let currentTabs = [];
let activeId = null;

// Render tab bar
function renderTabs(tabs) {
  currentTabs = tabs;
  tabsEl.innerHTML = '';
  tabs.forEach(tab => {
    const el = document.createElement('div');
    el.className = 'tab' + (tab.id === activeId ? ' active' : '');
    el.dataset.id = tab.id;

    const favHtml = tab.favicon
      ? `<img class="fav" src="${esc(tab.favicon)}" onerror="this.style.display='none'">`
      : `<span class="fav-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16" fill="#888" stroke="none"/></svg></span>`;

    el.innerHTML = `
      ${favHtml}
      <span class="title" title="${esc(tab.title)}">${esc(tab.title || 'YouTube')}</span>
      <button class="close" data-id="${esc(tab.id)}" title="Close tab">✕</button>
    `;

    el.addEventListener('click', e => {
      if (e.target.classList.contains('close')) return;
      activeId = tab.id;
      invoke('switch_tab', { id: tab.id });
      renderTabs(currentTabs);
    });
    el.querySelector('.close').addEventListener('click', e => {
      e.stopPropagation();
      invoke('close_tab', { id: tab.id });
    });

    tabsEl.appendChild(el);
  });
}

// Listen for tab updates from Rust backend
listen('tabs-updated', e => renderTabs(e.payload));

// Initial load
invoke('get_tabs').then(tabs => {
  if (tabs.length) { activeId = tabs[0].id; renderTabs(tabs); }
});

// New tab
document.getElementById('new-tab').onclick = () => {
  invoke('new_tab').then(id => { activeId = id; });
};

// Keyboard
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 't') { e.preventDefault(); document.getElementById('new-tab').click(); }
});

// Window controls — control the ACTIVE YouTube window, not the chrome strip
async function activeWin() {
  const { WebviewWindow } = window.__TAURI__.window;
  if (!activeId) return null;
  return WebviewWindow.getByLabel(activeId);
}

document.getElementById('btn-min').onclick = async () => {
  const w = await activeWin(); w?.minimize();
};
document.getElementById('btn-max').onclick = async () => {
  const w = await activeWin();
  if (!w) return;
  const max = await w.isMaximized();
  max ? w.unmaximize() : w.maximize();
};
document.getElementById('btn-close').onclick = async () => {
  if (activeId) invoke('close_tab', { id: activeId });
};

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
